name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SlackChannel: "#jenkins-ci-mv-opentelemetry"
  MIX_ENV: test
  POSTGRES_USER: ubuntu
  POSTGRES_PASSWORD: ubuntupassword
  POSTGRES_HOST: localhost

jobs:
  test:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write

    runs-on: ubuntu-latest
    name: Test on OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    strategy:
      # Specify the OTP and Elixir versions to use when building
      # and running the workflow steps.
      matrix:
        otp: ["27.2", "28.3"]
        elixir: ["1.18", "1.19", "1.20"]
    services:
      db:
        env:
          POSTGRES_USER: ubuntu
          POSTGRES_PASSWORD: ubuntupassword
        image: postgres:12-alpine
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Erlang/OTP with Elixir and mix
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix

      - name: Install dependencies
        run: |
          mix do deps.get + compile

      - name: Run pre-checks
        run: |
          mix format --check-formatted
          mix credo --strict
          mix dialyzer

      - name: Run mv-opentelemetry tests
        run: |
          mix test --cover

      - name: Test coverage
        uses: mindvalley/cobertura-action@master
        if: github.event_name == 'pull_request'
        with:
          path: "mv_opentelemetry.covertool.xml"
          minimum_coverage: 74
          report_name: "Test coverage: Elixir ${{matrix.elixir}} / OTP ${{matrix.otp}}"
          show_missing: true
          link_missing_lines: true
          only_changed_files: true
          link_missing_lines_source_dir: lib

  version-update:
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    runs-on: ubuntu-latest
    name: Library version updated when lib/ changes

    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Require a mix.exs version update for changes in lib/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"

          if git diff --quiet "$merge_base" HEAD -- lib/; then
            echo "No changes in lib/, version update not required."
            exit 0
          fi

          read_version() { sed -n 's/^ *version: "\(.*\)",$/\1/p' | head -1; }

          base_version="$(git show "$merge_base:mix.exs" | read_version)"
          head_version="$(read_version < mix.exs)"

          if [ "$base_version" = "$head_version" ]; then
            echo "::error file=mix.exs::lib/ changed but the version is still $head_version. Update it."
            exit 1
          fi

          newest="$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -1)"

          if [ "$newest" != "$head_version" ]; then
            echo "::error file=mix.exs::Version went backwards: $base_version -> $head_version."
            exit 1
          fi

          echo "Version updated: $base_version -> $head_version"
